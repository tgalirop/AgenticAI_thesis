[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticai-thesis"
version = "0.1.0"
description = "Agentic AI data-quality research pipeline for PaySim fraud detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0,<2.0",
  "pyarrow>=16.0,<26.0",
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "scikit-learn>=1.5,<2.0",
  "imbalanced-learn>=0.12,<1.0",
  "scipy>=1.13,<2.0",
  "matplotlib>=3.9,<4.0",
  "PyYAML>=6.0,<7.0",
  "joblib>=1.4,<2.0",
  "psutil>=6.0,<8.0",
  "pydantic>=2.8,<3.0",
  "python-dotenv>=1.0,<2.0",
  "langgraph>=0.2,<1.0",
  "langchain-core>=0.3,<1.0",
  "langsmith>=0.3.45,<0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
