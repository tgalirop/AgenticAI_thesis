[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agenticai-thesis"
version = "0.1.0"
description = "Agentic AI data-quality research pipeline for PaySim fraud detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "polars>=1.0,<2.0",
  "pyarrow>=16.0,<26.0",
  "PyYAML>=6.0,<7.0",
  "psutil>=6.0,<8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
