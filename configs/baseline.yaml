models:
  - logistic_regression
  - decision_tree
  - random_forest

cross_validation:
  folds: 5
  repeats: 5
  random_seed: 42

primary_metric: pr_auc

# Candidate strategies are evaluated on every fraud case plus a reproducible
# sample of normal transactions. The same sample is shared by every model.
sampling:
  negative_to_positive_ratio: 10

decision_threshold: 0.50

model_parameters:
  logistic_regression:
    max_iter: 1000
  decision_tree:
    min_samples_leaf: 2
  random_forest:
    n_estimators: 100
    max_depth: 20
    min_samples_leaf: 2
    n_jobs: -1
